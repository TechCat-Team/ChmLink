name: Driver

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: kits
        with:
          path: build/wdk
          key: wdk-x64-10.0.26100.6584
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Build x64 driver and catalog (with static analysis)
        shell: powershell
        run: ./tools/build-driver.ps1 -Restore -Analyze
      - uses: actions/cache/save@v4
        if: always() && steps.kits.outputs.cache-hit != 'true'
        with:
          path: build/wdk
          key: wdk-x64-10.0.26100.6584
      - uses: actions/upload-artifact@v4
        with:
          name: chmlink-x64-unsigned
          path: |
            build/driver/chmlink.sys
            build/driver/chmlink.inf
            build/driver/chmlink.cat
